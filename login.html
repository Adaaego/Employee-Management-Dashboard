<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="login.css">
    <title>Login</title>
</head>
<body>
    <div class="container">
        <div class="header">
            <img src="images/logo.png" alt="company logo" class="logo">

            <svg class="icon" id="sun-icon" onclick="changeTheme()">
                <use id="icon-use" xlink:href="images/sprite (10).svg#sun (1)"></use>
            </svg>
        </div>

        <div class="login-details">
            <form action="submit">
                <div class="heading">
                    <h1>Welcome, <br> Please authorize</h1>
                </div>
                
                <div class="role-selector">
                    <button type="button" class="role-btn selected" data-role="user">User</button>
                    <button type="button" class="role-btn" data-role="admin">Admin</button>
                </div>
            </form>
        </div>
    </div>

    <script src="login.js">
    </script>
</body>
</html>
